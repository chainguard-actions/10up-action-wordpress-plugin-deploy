name: Test generate-zip with missing credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          generate-zip: 'true'
          dry-run: 'false'
        env:
          # Intentionally omit SVN_USERNAME to trigger early exit
          SVN_PASSWORD: fake-password
          SLUG: test-plugin
          VERSION: 1.0.0

      - name: Assert action failed and zip-path output is empty
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ZIP_PATH: ${{ steps.action.outputs.zip-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "zip-path: '$ZIP_PATH'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when SVN_USERNAME is missing, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$ZIP_PATH" ]; then
            echo "FAIL: expected zip-path to be empty when action fails early, got '$ZIP_PATH'"
            exit 1
          fi
          echo "PASS: action failed correctly and zip-path is empty"
