name: Test generate-zip input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          SVN_USERNAME: "testuser"
          SVN_PASSWORD: "testpassword"
          SLUG: "test-plugin-harness-nonexistent-12345"
          VERSION: "1.0.0"
        with:
          generate-zip: "true"
          dry-run: "true"

      - name: Assert action ran with generate-zip and dry-run inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ZIP_PATH: ${{ steps.action.outputs.zip-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "zip-path: $ZIP_PATH"
          # The action passes credential checks and processes inputs.
          # SVN checkout may fail in the test environment (network/non-existent plugin),
          # which is acceptable. If it succeeds, zip-path may or may not be set
          # depending on whether the plugin version already exists in SVN.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran past credential checks with generate-zip=true (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
