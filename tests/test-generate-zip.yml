name: Test generate-zip output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git config
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install fake svn that creates expected directory structure with trunk content
        run: |
          python3 -c "
          import os
          script = '''#!/bin/sh
          case \"\$1\" in
            checkout)
              TARGET=\"\"
              for arg in \"\$@\"; do TARGET=\"\$arg\"; done
              mkdir -p \"\$TARGET/trunk\"
              mkdir -p \"\$TARGET/assets\"
              mkdir -p \"\$TARGET/tags/1.7.2\"
              echo \"<?php // Plugin stub\" > \"\$TARGET/trunk/hello-dolly.php\"
              echo \"Checked out revision 1 (fake).\"
              ;;
            update)
              echo \"Updated to revision 1 (fake).\"
              ;;
            add|status|commit|cp|propset|rm)
              echo \"fake svn \$1: ok\"
              ;;
            *)
              echo \"fake svn: \$*\"
              ;;
          esac
          exit 0
          '''
          with open('/tmp/fake-svn.sh', 'w') as f:
              f.write(script)
          os.chmod('/tmp/fake-svn.sh', 0o755)
          "
          if [ -w /usr/local/bin ]; then
            cp /tmp/fake-svn.sh /usr/local/bin/svn
          else
            sudo cp /tmp/fake-svn.sh /usr/local/bin/svn
          fi

      - id: action
        uses: .
        continue-on-error: true
        with:
          generate-zip: "true"
          dry-run: "true"
        env:
          SVN_USERNAME: fake-user
          SVN_PASSWORD: fake-password
          SLUG: hello-dolly
          VERSION: 1.7.2

      - name: Assert zip-path output or graceful failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ZIP_PATH: ${{ steps.action.outputs.zip-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "zip-path: $ZIP_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ZIP_PATH" ]; then
              echo "FAIL: action succeeded but zip-path output is empty"
              exit 1
            fi
            if [ ! -f "$ZIP_PATH" ]; then
              echo "FAIL: zip-path '$ZIP_PATH' does not point to an existing file"
              exit 1
            fi
            echo "PASS: zip file generated at '$ZIP_PATH'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
