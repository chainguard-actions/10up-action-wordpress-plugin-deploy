name: Test generate-zip input is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: deploy
        uses: .
        continue-on-error: true
        with:
          generate-zip: false
        # SVN credentials not set — action will fail at credential check
        # This test verifies the input is accepted without error before the credential check
      - name: Assert action failed at credential check (not at input parsing)
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because SVN_USERNAME is missing,
          # not because of an invalid input for generate-zip.
          # A failure here is expected and correct.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (missing credentials), got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action failed at credential check as expected (generate-zip input was accepted)"
