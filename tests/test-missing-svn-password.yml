name: Test missing SVN_PASSWORD
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          SVN_USERNAME: "testuser"
          SVN_PASSWORD: ""

      - name: Assert action failed due to missing SVN_PASSWORD
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when SVN_PASSWORD is not set, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when SVN_PASSWORD is missing"
