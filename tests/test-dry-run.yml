name: Test dry-run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install svn
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y subversion

      - id: action
        uses: .
        continue-on-error: true
        with:
          dry-run: 'true'
        env:
          SVN_USERNAME: fake-user
          SVN_PASSWORD: fake-password
          SLUG: test-plugin-that-does-not-exist-xyz123
          VERSION: 9.9.9

      - name: Assert action ran (passed credential check, attempted SVN ops)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action passes credential validation and attempts SVN checkout.
          # It may fail because the plugin slug doesn't exist on WordPress.org SVN,
          # or it may succeed if SVN checkout returns an empty repo.
          # Either way, it must NOT fail due to missing credentials.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran past credential validation (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
