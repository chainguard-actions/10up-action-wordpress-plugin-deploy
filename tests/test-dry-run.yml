name: Test dry-run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          SVN_USERNAME: fake-user
          SVN_PASSWORD: fake-password
          # Use a known real plugin slug so SVN checkout can succeed
          SLUG: hello-dolly
          # Set a version that is already published so the script exits early (after SVN checkout)
          VERSION: "1.7.2"
        with:
          dry-run: "true"

      - name: Assert action ran (dry-run with real SVN slug)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may succeed (if SVN checkout works and version already exists)
          # or fail (if network is unavailable). Either way it must not be skipped.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully in dry-run mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely SVN network issue in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
