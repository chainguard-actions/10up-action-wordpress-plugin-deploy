name: Test dry-run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          SVN_USERNAME: "testuser"
          SVN_PASSWORD: "testpassword"
          SLUG: "test-plugin-harness-nonexistent-12345"
          VERSION: "1.0.0"
        with:
          dry-run: "true"

      - name: Assert action ran (credentials accepted, dry-run attempted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action passes credential checks and attempts SVN checkout.
          # SVN checkout may fail in the test environment (network/non-existent plugin),
          # but the action must NOT fail due to missing credentials.
          # A failure here is acceptable (SVN network issue), but a success would
          # mean the dry-run completed (e.g. SVN accessible and plugin not found).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran past credential checks (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
