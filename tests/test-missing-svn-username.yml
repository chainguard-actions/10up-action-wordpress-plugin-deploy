name: Test missing SVN_USERNAME
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          # Intentionally omit SVN_USERNAME to trigger the validation error
          SVN_PASSWORD: fake-password
          SLUG: test-plugin
          VERSION: 1.0.0

      - name: Assert action failed due to missing SVN_USERNAME
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when SVN_USERNAME is missing, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when SVN_USERNAME was not set"
