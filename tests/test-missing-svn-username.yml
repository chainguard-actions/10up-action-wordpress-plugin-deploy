name: Test missing SVN_USERNAME fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: deploy
        uses: .
        continue-on-error: true
        # SVN_USERNAME and SVN_PASSWORD are intentionally not set
      - name: Assert action failed due to missing SVN_USERNAME
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when SVN_USERNAME is not set, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when SVN_USERNAME is missing"
