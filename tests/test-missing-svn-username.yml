name: Test missing SVN_USERNAME
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake svn to satisfy command_exists check
        run: |
          printf '%s\n' '#!/bin/sh' 'echo "fake svn: $*"' 'exit 0' > /tmp/fake-svn.sh
          chmod +x /tmp/fake-svn.sh
          if [ -w /usr/local/bin ]; then
            cp /tmp/fake-svn.sh /usr/local/bin/svn
          else
            sudo cp /tmp/fake-svn.sh /usr/local/bin/svn
          fi

      - id: action
        uses: .
        continue-on-error: true
        env:
          SVN_PASSWORD: fake-password
          SLUG: hello-dolly
          VERSION: 1.7.2

      - name: Assert action failed due to missing SVN_USERNAME
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when SVN_USERNAME is not set, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when SVN_USERNAME was missing"
